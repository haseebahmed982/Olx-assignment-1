<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLX </title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#fff;color:#002f34;}
.header{background:#f7f8f8;padding:10px 4%;display:flex;align-items:center;position:sticky;top:0;z-index:100;border-bottom:1px solid #ddd;}
.logo img{height:44px;border-radius:10px;}
.right{margin-left:auto;display:flex;gap:18px;align-items:center;}
.login a{color:#002f34;text-decoration:none;font-weight:700;}
.sell{border:4px solid;border-color:#ffce32 #3a77ff #23e5db #ffce32;border-radius:24px;padding:7px 18px;background:#fff;font-weight:800;}
.search-wrap{background:#f7f8f8;padding:12px 4%;display:flex;gap:12px;}
.loc-box{width:28%;background:#fff;border:2px solid #002f34;border-radius:4px;height:48px;display:flex;align-items:center;padding:0 10px;gap:8px;}
.loc-box input{border:0;outline:0;width:100%;}
.search-box{width:72%;background:#fff;border:2px solid #002f34;border-radius:4px;height:48px;display:flex;overflow:hidden;}
.search-box input{border:0;outline:0;width:100%;padding:0 14px;}
.search-box button{background:#002f34;color:#fff;border:0;padding:0 20px;}
.cat-bar{background:#fff;padding:12px 4%;display:flex;gap:22px;overflow-x:auto;white-space:nowrap;align-items:center;box-shadow:0 1px 1px rgba(0,0,0,0.1);}
.cat-item{font-size:13px;font-weight:600;text-decoration:none;color:#002f34;padding:5px 8px;border-radius:4px;}
.banner{margin:14px 4%;height:160px;border-radius:4px;overflow:hidden;}
.banner img{width:100%;height:100%;object-fit:cover;}
.title{padding:20px 4% 12px;font-size:22px;font-weight:700;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:16px;padding:0 4% 30px;text-align:center;}
.circle{width:88px;height:88px;margin:0 auto 8px;border-radius:50%;background:#f2f4f5;display:flex;align-items:center;justify-content:center;}
.circle img{width:64px;height:64px;object-fit:contain;}
.item p{font-size:13px;font-weight:600;}
</style>
</head>
<body>

<div class="header">
<div class="logo"><img src="olx_logo.png" alt="OLX"></div>
